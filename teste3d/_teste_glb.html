<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Teste GLB Realista - REABITECH</title>
<style>
  body { margin:0; overflow:hidden; background: radial-gradient(ellipse at center, #0d3a2b 0%, #061a14 100%); }
  canvas { display:block; }
  #info { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:10;
          color:#fff; font-family:'Inter',sans-serif; text-align:center; }
  #info h1 { font-size:1.2rem; font-weight:800; margin:0 0 4px; }
  #info p { font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0; }
  #loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
             color:#34d399; font-family:sans-serif; font-size:1rem; }
  .erro { color:#fca5a5; padding:20px; }
</style>
</head>
<body>
<div id="info">
  <h1>Modelo Anatômico Realista</h1>
  <p>Arraste para girar &middot; scroll para zoom</p>
</div>
<div id="loading">Carregando modelo 3D...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ================================================================
// CARREGADOR DE MODELO GLB REALISTA
// Coloca o arquivo body.glb na mesma pasta deste HTML
// ================================================================
(function() {
  var loadingEl = document.getElementById('loading');

  if (typeof THREE === 'undefined') {
    loadingEl.innerHTML = '<div class="erro">Erro: Three.js nao carregou.</div>';
    return;
  }

  // ----- Cena -----
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x061a14, 0.015);

  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 5);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // ----- Controles -----
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 2.5;
  controls.maxDistance = 10;
  controls.target.set(0, 1.5, 0);
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;

  // ----- Luzes (estúdio) -----
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));

  var key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(3, 6, 4);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x34d399, 0.8);
  fill.position.set(-4, 3, -3);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0x2BA181, 0.6);
  rim.position.set(0, 4, -5);
  scene.add(rim);

  // ----- Chão -----
  var chao = new THREE.Mesh(
    new THREE.CircleGeometry(3, 64),
    new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
  );
  chao.rotation.x = -Math.PI / 2;
  chao.position.y = -0.01;
  scene.add(chao);

  // ----- Carregar GLB -----
  var loader = new THREE.GLTFLoader();

  // Coloca o caminho do seu arquivo aqui:
  var MODELO_URL = 'body.glb';

  var modeloCarregado = false;

  loader.load(
    MODELO_URL,

    // onLoad
    function(gltf) {
      var modelo = gltf.scene;
      modeloCarregado = true;

      // Centraliza e escala automaticamente
      var box = new THREE.Box3().setFromObject(modelo);
      var size = box.getSize(new THREE.Vector3());
      var center = box.getCenter(new THREE.Vector3());

      // Ajusta o modelo para ficar em pé, centrado, ~1.8m
      var alturaDesejada = 1.8;
      var escala = alturaDesejada / size.y;
      modelo.scale.set(escala, escala, escala);

      // Recalcula após escala
      box.setFromObject(modelo);
      center = box.getCenter(new THREE.Vector3());
      modelo.position.sub(center);
      modelo.position.y += alturaDesejada / 2;

      scene.add(modelo);

      // Ajusta câmera
      controls.target.set(0, alturaDesejada / 2, 0);
      camera.position.set(0, alturaDesejada / 2, alturaDesejada * 2.2);

      loadingEl.style.display = 'none';

      console.log('Modelo carregado. Meshes:', modelo.children.length);

      // ============================================================
      // AQUI: destacar a região da lesão
      // O modelo tem sub-meshes nomeados. Ex: "muscle_knee_r"
      // Você pode achar pelo nome e mudar o material.
      // ============================================================
      // Exemplo:
      // modelo.traverse(function(child) {
      //   if (child.isMesh && child.name.indexOf('knee') !== -1) {
      //     child.material = new THREE.MeshStandardMaterial({ color: 0xff3b3b, emissive: 0xff2222 });
      //   }
      // });
    },

    // onProgress
    function(xhr) {
      if (xhr.total > 0) {
        var pct = Math.round((xhr.loaded / xhr.total) * 100);
        loadingEl.textContent = 'Carregando: ' + pct + '%';
      }
    },

    // onError
    function(erro) {
      console.error(erro);
      loadingEl.innerHTML = '<div class="erro">' +
        'Nao foi possivel carregar <code>body.glb</code>.<br><br>' +
        '1. Baixe o modelo em: <a href="https://github.com/hpfrei/body-anatomy-3d-viewer" style="color:#34d399;" target="_blank">github.com/hpfrei/body-anatomy-3d-viewer</a><br>' +
        '2. Coloque o arquivo <code>body.glb</code> na mesma pasta deste HTML<br>' +
        '3. Recarregue a pagina<br><br>' +
        '<small style="opacity:0.6;">Erro: ' + erro.message + '</small></div>';
    }
  );

  // ----- Loop -----
  function animar() {
    requestAnimationFrame(animar);
    controls.update();
    renderer.render(scene, camera);
  }
  animar();

  // ----- Resize -----
  addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
