<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo 3D - REABITECH</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; }
    body { background: radial-gradient(ellipse at center, #0d3a2b 0%, #061a14 70%, #030d09 100%); color: #fff; }

    #canvas-wrap { position: fixed; inset: 0; z-index: 1; }

    .hero-info { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; pointer-events: none; }
    .hero-info h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .hero-info p { font-size: 0.78rem; color: rgba(255,255,255,0.5); margin-top: 4px; }

    .painel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 10px 12px; background: rgba(10,42,32,0.75); border: 1px solid rgba(52,211,153,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; max-width: 94vw; }
    .painel button { padding: 7px 12px; border-radius: 9px; border: 1px solid rgba(52,211,153,0.22); background: rgba(52,211,153,0.06); color: rgba(255,255,255,0.8); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.25s cubic-bezier(0.16,1,0.3,1); font-family: inherit; }
    .painel button:hover { background: rgba(52,211,153,0.16); color: #fff; transform: translateY(-1px); }
    .painel button.ativo { background: linear-gradient(135deg, #34d399, #2BA181); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(52,211,153,0.4); }

    .tooltip { position: fixed; z-index: 20; padding: 10px 14px; background: rgba(10,42,32,0.96); border: 1px solid rgba(52,211,153,0.3); border-radius: 12px; color: #fff; font-size: 0.8rem; pointer-events: none; opacity: 0; transition: opacity 0.15s; box-shadow: 0 12px 32px rgba(0,0,0,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: 240px; }
    .tooltip.visivel { opacity: 1; }
    .tooltip strong { color: #34d399; display: block; margin-bottom: 3px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }

    .legenda { position: fixed; top: 22px; right: 22px; z-index: 10; padding: 12px 14px; background: rgba(10,42,32,0.7); border: 1px solid rgba(52,211,153,0.18); border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 0.72rem; }
    .legenda-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: rgba(255,255,255,0.72); }
    .legenda-item:last-child { margin-bottom: 0; }
    .legenda-dot { width: 9px; height: 9px; border-radius: 50%; }
    .legenda-dot.normal { background: #5b8a78; }
    .legenda-dot.lesionado { background: #dc2626; box-shadow: 0 0 8px #dc2626; }
    .legenda-dot.destaque { background: #34d399; box-shadow: 0 0 8px #34d399; }

    .erro-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; padding: 20px 28px; background: rgba(127, 29, 29, 0.9); border: 1px solid rgba(248, 113, 113, 0.5); border-radius: 14px; color: #fff; font-size: 0.9rem; max-width: 400px; display: none; }

    @media (max-width: 768px) {
        .hero-info h1 { font-size: 1rem; } .hero-info p { display: none; }
        .legenda { top: 12px; right: 12px; padding: 8px 10px; font-size: 0.65rem; }
        .painel { bottom: 10px; padding: 8px; gap: 4px; }
        .painel button { padding: 6px 8px; font-size: 0.65rem; }
    }
</style>
</head>
<body>

<div class="hero-info">
    <h1>Corpo 3D Interativo</h1>
    <p>Arraste para girar &middot; scroll para zoom &middot; clique nos botoes pra testar</p>
</div>

<div class="legenda">
    <div class="legenda-item"><span class="legenda-dot normal"></span><span>Regiao normal</span></div>
    <div class="legenda-item"><span class="legenda-dot lesionado"></span><span>Lesionado</span></div>
    <div class="legenda-item"><span class="legenda-dot destaque"></span><span>Hover</span></div>
</div>

<div class="painel" id="painel">
    <button data-regiao="cabeca">Cabeca</button>
    <button data-regiao="cervical">Cervical</button>
    <button data-regiao="ombro" data-lado="direito">Ombro D.</button>
    <button data-regiao="ombro" data-lado="esquerdo">Ombro E.</button>
    <button data-regiao="cotovelo" data-lado="direito">Cotovelo D.</button>
    <button data-regiao="punho" data-lado="direito">Punho D.</button>
    <button data-regiao="coluna">Coluna</button>
    <button data-regiao="lombar">Lombar</button>
    <button data-regiao="quadril" data-lado="direito">Quadril D.</button>
    <button data-regiao="coxa" data-lado="direito">Coxa D.</button>
    <button data-regiao="joelho" data-lado="direito">Joelho D.</button>
    <button data-regiao="joelho" data-lado="esquerdo">Joelho E.</button>
    <button data-regiao="panturrilha" data-lado="direito">Panturrilha D.</button>
    <button data-regiao="tornozelo" data-lado="direito">Tornozelo D.</button>
    <button data-regiao="pe" data-lado="direito">Pe D.</button>
</div>

<div class="tooltip" id="tooltip">
    <strong id="tt-titulo">-</strong>
    <div id="tt-desc">-</div>
</div>

<div class="erro-box" id="erro-box"></div>

<div id="canvas-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
window.addEventListener('error', function(e) {
    var box = document.getElementById('erro-box');
    if (box) {
        box.style.display = 'block';
        box.innerHTML = '<strong>Erro 3D:</strong><br>' + (e.message || 'desconhecido');
    }
});

(function() {
    'use strict';
    if (typeof THREE === 'undefined') { return; }

    var wrap = document.getElementById('canvas-wrap');
    var tooltip = document.getElementById('tooltip');
    var ttTitulo = document.getElementById('tt-titulo');
    var ttDesc = document.getElementById('tt-desc');

    // ========== CENA ==========
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x061a14, 0.022);

    var camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 6.5);
    camera.lookAt(0, 1.5, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    // ========== CONTROLES ==========
    var controls = null;
    if (typeof THREE.OrbitControls === 'function') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 4.0;
        controls.maxDistance = 9.0;
        controls.target.set(0, 1.5, 0);
        controls.maxPolarAngle = Math.PI * 0.9;
        controls.minPolarAngle = Math.PI * 0.1;
        controls.enablePan = false;
        controls.autoRotate = false;  // rotação vai no corpo, não na câmera
    }

    // ========== LUZES ==========
    scene.add(new THREE.AmbientLight(0xa7f3d0, 0.35));

    // Key light - branca forte de frente-direita-topo
    var keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);

    // Rim light verde de trás-esquerda
    var rimLight = new THREE.DirectionalLight(0x34d399, 1.0);
    rimLight.position.set(-5, 4, -4);
    scene.add(rimLight);

    // Rim light verde de trás-direita (contorno)
    var rimLight2 = new THREE.DirectionalLight(0x2BA181, 0.7);
    rimLight2.position.set(5, 3, -5);
    scene.add(rimLight2);

    // Fill light suave embaixo
    var fillLight = new THREE.PointLight(0xffffff, 0.3, 8);
    fillLight.position.set(0, 0.5, 3);
    scene.add(fillLight);

    // ========== CHAO ==========
    var chao = new THREE.Mesh(
        new THREE.CircleGeometry(3.2, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
    );
    chao.rotation.x = -Math.PI / 2;
    chao.position.y = -0.02;
    scene.add(chao);

    // Anel base
    var ringBase = new THREE.Mesh(
        new THREE.RingGeometry(1.95, 2.05, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    ringBase.rotation.x = -Math.PI / 2;
    ringBase.position.y = -0.01;
    scene.add(ringBase);

    // ========== MATERIAIS ==========
    var matNormal = new THREE.MeshStandardMaterial({
        color: 0x6b9a86, metalness: 0.3, roughness: 0.62,
        emissive: 0x0a2a20, emissiveIntensity: 0.4,
        flatShading: false,
    });
    var matNormalEsq = new THREE.MeshStandardMaterial({
        color: 0x5a8672, metalness: 0.3, roughness: 0.62,
        emissive: 0x0a2a20, emissiveIntensity: 0.4,
    });
    var matLesionado = new THREE.MeshStandardMaterial({
        color: 0xff4a4a, metalness: 0.35, roughness: 0.35,
        emissive: 0xff2222, emissiveIntensity: 1.3,
    });
    var matHover = new THREE.MeshStandardMaterial({
        color: 0x34d399, metalness: 0.4, roughness: 0.3,
        emissive: 0x34d399, emissiveIntensity: 1.1,
    });

    // ========== HELPERS ==========
    // Lathe helper: profile = [[r, y], [r, y], ...]
    function makeLathe(parent, nome, lado, perfil, mat, flattenZ) {
        var points = [];
        for (var i = 0; i < perfil.length; i++) {
            points.push(new THREE.Vector2(perfil[i][0], perfil[i][1]));
        }
        var geo = new THREE.LatheGeometry(points, 32);
        var m = new THREE.Mesh(geo, mat || matNormal);
        if (flattenZ && flattenZ !== 1) m.scale.z = flattenZ;
        m.userData.regiao = nome;
        m.userData.lado = lado || '';
        m.userData.matBase = mat || matNormal;
        parent.add(m);
        return m;
    }

    function addSphere(parent, nome, lado, x, y, z, raio, mat, sx, sy, sz) {
        var geo = new THREE.SphereGeometry(raio, 24, 18);
        var m = new THREE.Mesh(geo, mat || matNormal);
        m.position.set(x, y, z);
        if (sx !== undefined || sy !== undefined || sz !== undefined) {
            m.scale.set(sx || 1, sy || 1, sz || 1);
        }
        m.userData.regiao = nome;
        m.userData.lado = lado || '';
        m.userData.matBase = mat || matNormal;
        parent.add(m);
        return m;
    }

    function addBox(parent, nome, lado, x, y, z, dims, mat) {
        var geo = new THREE.BoxGeometry(dims[0], dims[1], dims[2]);
        var m = new THREE.Mesh(geo, mat || matNormal);
        m.position.set(x, y, z);
        m.userData.regiao = nome;
        m.userData.lado = lado || '';
        m.userData.matBase = mat || matNormal;
        parent.add(m);
        return m;
    }

    // ========== CORPO ==========
    // Estrutura: y=0 pés no chão, y=2.85 topo da cabeça
    // Proporção ~1:7 (cabeça : corpo)
    var corpo = new THREE.Group();
    scene.add(corpo);
    var todos = [];

    // ---- CABECA ----
    // Cranio (esfera alta)
    todos.push(addSphere(corpo, 'cabeca', '', 0, 2.66, 0, 0.22, null, 1, 1.08, 0.95));
    // Face / mandíbula (esfera menor em frente e embaixo)
    todos.push(addSphere(corpo, 'cabeca', '', 0, 2.55, 0.03, 0.18, null, 0.92, 0.78, 0.9));

    // ---- CERVICAL (pescoço) ----
    // Lathe: [raio, y] de baixo pra cima
    todos.push(makeLathe(corpo, 'cervical', '', [
        [0.11, 2.36],
        [0.12, 2.42],
        [0.11, 2.48],
        [0.10, 2.52],
    ], null, 0.9));

    // ---- COLUNA (tórax) ----
    // Lathe com perfil orgânico do peito
    todos.push(makeLathe(corpo, 'coluna', '', [
        [0.16, 2.32],   // topo (base do pescoço)
        [0.22, 2.24],   // trapézio
        [0.30, 2.14],   // ombros
        [0.32, 2.02],   // peito alto
        [0.32, 1.92],   // peito (mais largo)
        [0.30, 1.82],   // peito baixo
        [0.28, 1.72],   // costelas
        [0.26, 1.66],
    ], null, 0.62));

    // ---- LOMBAR (cintura) ----
    todos.push(makeLathe(corpo, 'lombar', '', [
        [0.26, 1.66],
        [0.25, 1.58],
        [0.24, 1.50],
        [0.24, 1.44],
        [0.25, 1.38],
        [0.27, 1.33],
    ], null, 0.72));

    // ---- QUADRIL ----
    todos.push(makeLathe(corpo, 'quadril', '', [
        [0.27, 1.33],
        [0.29, 1.28],
        [0.31, 1.22],
        [0.31, 1.16],
        [0.30, 1.10],
        [0.28, 1.05],
    ], null, 0.75));

    // ===== BRACO DIREITO =====
    // Shoulder joint em (0.38, 2.10, 0)
    var gBracoD = new THREE.Group();
    gBracoD.position.set(0.38, 0, 0);
    corpo.add(gBracoD);

    // Ombro (deltoide) - esfera um pouco achatada
    todos.push(addSphere(gBracoD, 'ombro', 'direito', 0, 2.10, 0, 0.13, null, 1, 0.95, 0.95));
    // Biceps (esfera escalada vertical)
    todos.push(addSphere(gBracoD, 'braco', 'direito', 0, 1.88, 0, 0.09, null, 1, 2.2, 1));
    // Cotovelo
    todos.push(addSphere(gBracoD, 'cotovelo', 'direito', 0, 1.68, 0, 0.09));
    // Antebraço (mais fino, ligeiramente elíptico)
    todos.push(addSphere(gBracoD, 'antebraco', 'direito', 0, 1.44, 0, 0.075, null, 1, 2.0, 1));
    // Punho
    todos.push(addSphere(gBracoD, 'punho', 'direito', 0, 1.22, 0, 0.06));
    // Mão
    todos.push(addSphere(gBracoD, 'mao', 'direito', 0, 1.10, 0, 0.07, null, 0.9, 1.6, 0.55));

    // ===== BRACO ESQUERDO =====
    var gBracoE = new THREE.Group();
    gBracoE.position.set(-0.38, 0, 0);
    corpo.add(gBracoE);

    todos.push(addSphere(gBracoE, 'ombro', 'esquerdo', 0, 2.10, 0, 0.13, matNormalEsq, 1, 0.95, 0.95));
    todos.push(addSphere(gBracoE, 'braco', 'esquerdo', 0, 1.88, 0, 0.09, matNormalEsq, 1, 2.2, 1));
    todos.push(addSphere(gBracoE, 'cotovelo', 'esquerdo', 0, 1.68, 0, 0.09, matNormalEsq));
    todos.push(addSphere(gBracoE, 'antebraco', 'esquerdo', 0, 1.44, 0, 0.075, matNormalEsq, 1, 2.0, 1));
    todos.push(addSphere(gBracoE, 'punho', 'esquerdo', 0, 1.22, 0, 0.06, matNormalEsq));
    todos.push(addSphere(gBracoE, 'mao', 'esquerdo', 0, 1.10, 0, 0.07, matNormalEsq, 0.9, 1.6, 0.55));

    // ===== PERNA DIREITA =====
    // Hip joint em (0.14, 1.15, 0)
    var gPernaD = new THREE.Group();
    gPernaD.position.set(0.14, 0, 0);
    corpo.add(gPernaD);

    // Coxa (bem alongada)
    todos.push(addSphere(gPernaD, 'coxa', 'direito', 0, 0.98, 0, 0.145, null, 1, 2.2, 1.05));
    // Joelho
    todos.push(addSphere(gPernaD, 'joelho', 'direito', 0, 0.72, 0, 0.115));
    // Panturrilha (gastrocnêmio - volume em cima)
    todos.push(addSphere(gPernaD, 'panturrilha', 'direito', 0, 0.52, 0, 0.115, null, 1, 1.6, 1.1));
    // Tornozelo
    todos.push(addSphere(gPernaD, 'tornozelo', 'direito', 0, 0.18, 0, 0.075));
    // Pé
    todos.push(addBox(gPernaD, 'pe', 'direito', 0, 0.045, 0.07, [0.13, 0.09, 0.22]));

    // ===== PERNA ESQUERDA =====
    var gPernaE = new THREE.Group();
    gPernaE.position.set(-0.14, 0, 0);
    corpo.add(gPernaE);

    todos.push(addSphere(gPernaE, 'coxa', 'esquerdo', 0, 0.98, 0, 0.145, matNormalEsq, 1, 2.2, 1.05));
    todos.push(addSphere(gPernaE, 'joelho', 'esquerdo', 0, 0.72, 0, 0.115, matNormalEsq));
    todos.push(addSphere(gPernaE, 'panturrilha', 'esquerdo', 0, 0.52, 0, 0.115, matNormalEsq, 1, 1.6, 1.1));
    todos.push(addSphere(gPernaE, 'tornozelo', 'esquerdo', 0, 0.18, 0, 0.075, matNormalEsq));
    todos.push(addBox(gPernaE, 'pe', 'esquerdo', 0, 0.045, 0.07, [0.13, 0.09, 0.22], matNormalEsq));

    // ========== GLOW SPRITE (aura vermelha no local) ==========
    function makeRadialTexture(color1, color2) {
        var cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        var cctx = cv.getContext('2d');
        var grad = cctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        grad.addColorStop(0, color1);
        grad.addColorStop(0.35, color2);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        cctx.fillStyle = grad;
        cctx.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(cv);
    }

    var glowTex = makeRadialTexture('rgba(255,90,90,1)', 'rgba(255,40,40,0.4)');
    var glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.75
    }));
    glowSprite.scale.set(0.5, 0.5, 1);
    scene.add(glowSprite);

    // ========== ANEL EXPANSIVO (2 anéis que expandem) ==========
    var ringTex = (function() {
        var cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        var ctx = cv.getContext('2d');
        ctx.strokeStyle = 'rgba(255,100,100,1)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(128, 128, 118, 0, Math.PI * 2);
        ctx.stroke();
        return new THREE.CanvasTexture(cv);
    })();

    var rings = [];
    for (var ri = 0; ri < 2; ri++) {
        var r = new THREE.Sprite(new THREE.SpriteMaterial({
            map: ringTex, blending: THREE.AdditiveBlending,
            depthWrite: false, transparent: true, opacity: 0.9
        }));
        r.userData.offset = ri * 0.5;
        r.scale.set(0.3, 0.3, 1);
        scene.add(r);
        rings.push(r);
    }

    // ========== PARTICULAS AMBIENTE ==========
    var pGeo = new THREE.BufferGeometry();
    var N = 90;
    var pPos = new Float32Array(N * 3);
    for (var i = 0; i < N * 3; i += 3) {
        var ang = Math.random() * Math.PI * 2;
        var rad = 0.6 + Math.random() * 2.5;
        pPos[i] = Math.cos(ang) * rad;
        pPos[i+1] = Math.random() * 3;
        pPos[i+2] = Math.sin(ang) * rad;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    var pMat = new THREE.PointsMaterial({
        color: 0x34d399, size: 0.025, transparent: true, opacity: 0.45,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    var particulas = new THREE.Points(pGeo, pMat);
    scene.add(particulas);

    // ========== ESTADO ==========
    var lesaoAtual = { regiao: 'joelho', lado: 'direito' };
    var hoverAtual = null;

    function corBase(m) { return m.userData.matBase || matNormal; }

    function ehLesao(m) {
        return m.userData.regiao === lesaoAtual.regiao &&
               (lesaoAtual.lado === '' || m.userData.lado === '' || m.userData.lado === lesaoAtual.lado);
    }

    function resetarCores() {
        for (var i = 0; i < todos.length; i++) {
            var m = todos[i];
            if (m === hoverAtual) continue;
            m.material = ehLesao(m) ? matLesionado : corBase(m);
        }
    }

    function encontrarAlvo() {
        for (var i = 0; i < todos.length; i++) {
            var m = todos[i];
            if (m.userData.regiao === lesaoAtual.regiao &&
                (lesaoAtual.lado === '' || m.userData.lado === '' || m.userData.lado === lesaoAtual.lado)) {
                return m;
            }
        }
        return null;
    }

    function atualizarGlow() {
        var alvo = encontrarAlvo();
        if (alvo) {
            var p = new THREE.Vector3();
            alvo.getWorldPosition(p);
            // Adiciona offset pra glow ficar na superfície
            glowSprite.position.copy(p);
            glowSprite.position.z += 0.25;
            glowSprite.visible = true;
            for (var i = 0; i < rings.length; i++) {
                rings[i].position.copy(p);
                rings[i].position.z += 0.25;
                rings[i].visible = true;
            }
        } else {
            glowSprite.visible = false;
            for (var j = 0; j < rings.length; j++) rings[j].visible = false;
        }
    }

    function destacarLesao(regiao, lado) {
        lesaoAtual = { regiao: regiao, lado: lado || '' };
        resetarCores();
        atualizarGlow();

        if (controls) {
            var alvo = encontrarAlvo();
            if (alvo) {
                var p = new THREE.Vector3();
                alvo.getWorldPosition(p);
                // Zoom suave pro local
                controls.target.lerp(p, 0.4);
                controls.target.lerp(new THREE.Vector3(p.x, 1.5, p.z), 0.3);
            }
        }
    }

    // ========== RAYCAST ==========
    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('mousemove', function(e) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(todos, false);

        if (hits.length > 0) {
            var m = hits[0].object;
            if (hoverAtual !== m) {
                if (hoverAtual && hoverAtual.material === matHover) {
                    hoverAtual.material = ehLesao(hoverAtual) ? matLesionado : corBase(hoverAtual);
                }
                hoverAtual = m;
                if (m.material !== matLesionado) m.material = matHover;

                var nomeReg = (m.userData.regiao || '').replace(/^./, function(c){return c.toUpperCase();});
                var nomeLado = m.userData.lado ? ' ' + m.userData.lado : '';
                ttTitulo.textContent = nomeReg + nomeLado;
                ttDesc.textContent = 'Clique pra inspecionar';
                tooltip.classList.add('visivel');
            }
            tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 260) + 'px';
            tooltip.style.top = Math.min(e.clientY + 16, window.innerHeight - 100) + 'px';
        } else {
            if (hoverAtual) {
                if (hoverAtual.material === matHover) {
                    hoverAtual.material = ehLesao(hoverAtual) ? matLesionado : corBase(hoverAtual);
                }
                hoverAtual = null;
            }
            tooltip.classList.remove('visivel');
        }
    });

    renderer.domElement.addEventListener('mouseleave', function() {
        tooltip.classList.remove('visivel');
        if (hoverAtual) {
            if (hoverAtual.material === matHover) {
                hoverAtual.material = ehLesao(hoverAtual) ? matLesionado : corBase(hoverAtual);
            }
            hoverAtual = null;
        }
    });

    // ========== BOTOES ==========
    var botoes = document.querySelectorAll('#painel button');
    for (var bi = 0; bi < botoes.length; bi++) {
        (function(b) {
            b.addEventListener('click', function() {
                for (var j = 0; j < botoes.length; j++) botoes[j].classList.remove('ativo');
                b.classList.add('ativo');
                destacarLesao(b.dataset.regiao, b.dataset.lado || '');
            });
        })(botoes[bi]);
    }

    var botaoInicial = document.querySelector('#painel button[data-regiao="joelho"][data-lado="direito"]');
    if (botaoInicial) {
        botaoInicial.classList.add('ativo');
        destacarLesao('joelho', 'direito');
    }

    // ========== ANIMA ==========
    var clock = new THREE.Clock();
    var userInteracting = false;
    var lastUserAction = 0;

    // Pausa a auto-rotação 3s depois da última interação
    ['mousedown', 'touchstart', 'wheel'].forEach(function(evt) {
        renderer.domElement.addEventListener(evt, function() {
            userInteracting = true;
            lastUserAction = clock.getElapsedTime();
        }, { passive: true });
    });

    function animar() {
        requestAnimationFrame(animar);
        var t = clock.getElapsedTime();
        var dt = clock.getDelta ? 0.016 : 0.016;  // aproximação

        // ---- Auto-rotação do corpo (bem devagar) ----
        // 0.12 rad/s → ~52s pra dar uma volta completa
        var idleTime = t - lastUserAction;
        if (idleTime > 3 || !userInteracting) {
            corpo.rotation.y += 0.002;   // ~0.12 rad/s @ 60fps
        }

        // ---- Auto-zoom (câmera oscila 5.2 ↔ 7.2) ----
        if (controls) {
            var dir = camera.position.clone().sub(controls.target).normalize();
            var currentDist = camera.position.distanceTo(controls.target);
            var targetDist = 6.2 + Math.sin(t * 0.22) * 1.0;  // ±1.0, período ~28s
            var newDist = currentDist + (targetDist - currentDist) * 0.015;
            camera.position.copy(controls.target).addScaledVector(dir, newDist);
        }

        // ---- Glow pulsante ----
        var pulse = 1 + Math.sin(t * 2.2) * 0.12;
        var baseGlow = 0.55;
        glowSprite.scale.set(baseGlow * pulse, baseGlow * pulse, 1);
        glowSprite.material.opacity = 0.55 + Math.sin(t * 2.2) * 0.2;

        // ---- Anéis expansivos ----
        for (var ri = 0; ri < rings.length; ri++) {
            var r = rings[ri];
            var cycle = (t + r.userData.offset) % 2.4;
            var progress = cycle / 2.4;
            var escala = 0.4 + progress * 1.4;
            r.scale.set(escala, escala, 1);
            r.material.opacity = Math.max(0, 1 - progress) * 0.7;
        }

        // ---- Partículas flutuando devagar ----
        var posArr = particulas.geometry.attributes.position;
        for (var i = 1; i < posArr.array.length; i += 3) {
            posArr.array[i] += Math.sin(t * 0.8 + i) * 0.0006;
        }
        posArr.needsUpdate = true;

        // ---- Base ring pulsa suave ----
        ringBase.material.opacity = 0.18 + Math.sin(t * 1.2) * 0.06;

        if (controls) controls.update();
        renderer.render(scene, camera);
    }
    animar();

    window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

})();
</script>
</body>
</html>
