{% extends 'base.html' %}

{% block content %}

<div class="topbar">
<h1>Atletas</h1>

<a href="/atletas/novo/" class="btn">
Novo Atleta
</a>
</div>

<div class="table-area">

<table>

<tr>
<th>Nome</th>
<th>Idade</th>
<th>Esporte</th>
<th>Status</th>
</tr>

{% for atleta in atletas %}

<tr>

<td>{{ atleta.nome }}</td>

<td>{{ atleta.idade }}</td>

<td>{{ atleta.esporte }}</td>

<td>
<span class="status ok">
{{ atleta.status }}
</span>
</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
