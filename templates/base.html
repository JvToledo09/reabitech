<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REABITECH - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --cor-principal: #000000;
            --cor-secundaria: #2BA181;
            --cor-complementar: #5A6461;
            --cor-neutra: #D1D9D7;
            --cor-clara: #FFFFFF;
            --gradiente: linear-gradient(135deg, #2BA181, #5A6461);
            --sombra: 0 10px 30px rgba(0,0,0,0.1);
            --transicao: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        [data-bs-theme="dark"] {
            --cor-principal: #1a1a2e;
            --cor-neutra: #2d2d44;
            --cor-clara: #16213e;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8edf2 100%);
            min-height: 100vh;
            transition: var(--transicao);
        }
        
        [data-bs-theme="dark"] body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
        }
        
        /* Navbar */
        .navbar-reabitech {
            background: var(--cor-principal);
            padding: 1rem 2rem;
            box-shadow: var(--sombra);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .logo-reabitech {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradiente);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            transition: var(--transicao);
        }
        
        .logo-reabitech:hover {
            transform: scale(1.05);
        }
        
        /* Cards Modernos */
        .card-modern {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            border: none;
            box-shadow: var(--sombra);
            transition: var(--transicao);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        [data-bs-theme="dark"] .card-modern {
            background: rgba(30, 30, 50, 0.95);
            color: white;
        }
        
        .card-modern:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(43, 161, 129, 0.2);
        }
        
        .card-header-custom {
            background: var(--gradiente);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: 600;
            border: none;
        }
        
        /* Stats Cards */
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            transition: var(--transicao);
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        [data-bs-theme="dark"] .stat-card {
            background: #1e1e32;
            color: white;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(43, 161, 129, 0.15);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            background: var(--gradiente);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            transition: var(--transicao);
        }
        
        .stat-card:hover .stat-icon {
            transform: scale(1.1);
        }
        
        .stat-icon i {
            font-size: 1.8rem;
            color: white;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradiente);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Botões */
        .btn-primary-custom {
            background: var(--gradiente);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: var(--transicao);
            color: white;
        }
        
        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(43, 161, 129, 0.4);
        }
        
        .btn-outline-custom {
            border: 2px solid var(--cor-secundaria);
            background: transparent;
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--cor-secundaria);
            transition: var(--transicao);
        }
        
        .btn-outline-custom:hover {
            background: var(--cor-secundaria);
            color: white;
            transform: translateY(-2px);
        }
        
        /* Tabelas */
        .table-custom {
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        
        [data-bs-theme="dark"] .table-custom {
            background: #1e1e32;
            color: white;
        }
        
        .table-custom thead {
            background: var(--gradiente);
            color: white;
        }
        
        .table-custom th, .table-custom td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        /* Progress Bar */
        .progress-custom {
            height: 10px;
            border-radius: 10px;
            background: var(--cor-neutra);
            overflow: hidden;
        }
        
        .progress-bar-custom {
            background: var(--gradiente);
            border-radius: 10px;
            transition: width 1s ease;
        }
        
        /* Badges */
        .badge-success {
            background: var(--cor-secundaria);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .badge-warning {
            background: #ffc107;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .badge-danger {
            background: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        /* Animações */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .animate-slideInLeft {
            animation: slideInLeft 0.5s ease forwards;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* Dark Mode Toggle */
        .dark-mode-toggle {
            background: var(--gradiente);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transicao);
        }
        
        .dark-mode-toggle:hover {
            transform: rotate(15deg);
        }
        
        /* Container */
        .container-custom {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Sidebar para perfis */
        .sidebar-stats {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        [data-bs-theme="dark"] .sidebar-stats {
            background: #1e1e32;
        }
        
        /* Responsivo */
        @media (max-width: 768px) {
            .container-custom { padding: 15px; }
            .stat-number { font-size: 1.8rem; }
            .navbar-reabitech { padding: 0.8rem 1rem; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar-reabitech">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-3">
                <a class="logo-reabitech" href="{% url 'dashboard' %}">
                    <i class="fas fa-heartbeat me-2"></i>REABI<span>TECH</span>
                </a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <!-- Dark Mode Toggle -->
                <button class="dark-mode-toggle" id="darkModeToggle">
                    <i class="fas fa-moon text-white"></i>
                </button>
                
                <!-- User Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle me-1"></i>
                        {{ user.get_full_name|default:user.username }}
                        <small class="d-block small">{{ user.perfil.get_tipo_display }}</small>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Meu Perfil</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fas fa-bell me-2"></i>Notificações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}
    
    <div class="container-custom">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show animate-fadeInUp" role="alert">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% else %}info-circle{% endif %} me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const htmlElement = document.documentElement;
        
        // Verificar preferência salva
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            darkModeToggle.innerHTML = '<i class="fas fa-sun text-white"></i>';
        }
        
        darkModeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            if (currentTheme === 'dark') {
                htmlElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
                darkModeToggle.innerHTML = '<i class="fas fa-moon text-white"></i>';
            } else {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                darkModeToggle.innerHTML = '<i class="fas fa-sun text-white"></i>';
            }
        });
        
        // Animações de entrada
        const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.card-modern, .stat-card').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 0.6s ease';
            observer.observe(el);
        });
        
        // Progress Bar Animation
        const progressBars = document.querySelectorAll('.progress-bar-custom');
        progressBars.forEach(bar => {
            const width = bar.style.width;
            bar.style.width = '0';
            setTimeout(() => { bar.style.width = width; }, 200);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
