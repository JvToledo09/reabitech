{% extends 'base.html' %}{% load static %}{% block content %}
<style>
    .form-control-dark {
        background-color: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        color: #ffffff !important;
        padding: 12px;
    }
    .form-control-dark:focus {
        background-color: rgba(0,0,0,0.4) !important;
        border-color: #10b981 !important;
        color: #ffffff !important;
        box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25) !important;
    }
    .form-label {
        color: #cbd5e1;
        font-weight: 600;
        margin-bottom: 8px;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-4">
                <a href="{% url 'dashboard:superadmin_planos' %}" class="btn btn-outline-secondary btn-sm me-3"><i class="ph ph-arrow-left"></i> Voltar</a>
                <h3 class="fw-bold mb-0">Editar Plano: {{ plano.nome }}</h3>
            </div>

            <div class="card border-0 shadow-lg" style="background: var(--bg-elevated); border-radius: 16px;">
                <div class="card-body p-5">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label">Nome do Plano</label>
                            <input type="text" name="nome" class="form-control form-control-dark" value="{{ plano.nome }}" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Preço Mensal (R$)</label>
                                <input type="number" step="0.01" name="preco_mensal" class="form-control form-control-dark" value="{{ plano.preco_mensal }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status Atual</label>
                                <input type="text" class="form-control form-control-dark" value="{% if plano.ativo %}Ativo{% else %}Inativo{% endif %}" disabled>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Limite de Usuários</label>
                                <input type="number" name="max_usuarios" class="form-control form-control-dark" value="{{ plano.max_usuarios }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Limite de Projetos</label>
                                <input type="number" name="max_projetos" class="form-control form-control-dark" value="{{ plano.max_projetos }}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Descrição do Plano</label>
                            <textarea name="descricao" class="form-control form-control-dark" rows="4">{{ plano.descricao }}</textarea>
                        </div>

                        <hr style="border-color: rgba(255,255,255,0.1);">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'dashboard:superadmin_planos' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4"><i class="ph ph-check"></i> Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
