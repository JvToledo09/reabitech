{% extends 'base.html' %}
{% load static %}
{% block title %}Login - REABITECH{% endblock %}
{% block content %}

<div class="container py-5" style="max-width: 500px;">
    <div class="card-modern p-4" data-aos="fade-up">
        <div class="text-center mb-4">
            <img src="{% static 'images/logo.png' %}" alt="REABITECH" style="max-height: 80px;" onerror="this.src='https://via.placeholder.com/80x80?text=RE'">
            <h3 class="mt-3">Bem-vindo ao REABITECH</h3>
            <p class="text-muted">Entre com seu RM ou E-mail</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">RM ou E-mail</label>
                <input type="text" name="username" class="form-control form-control-custom" placeholder="Digite seu RM ou E-mail" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control form-control-custom" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
        
        <div class="text-center mt-3">
            <p class="text-muted small">
                Não tem uma conta? 
                <a href="{% url 'landing' %}#planos" class="text-secondary-custom">Contrate um plano</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
