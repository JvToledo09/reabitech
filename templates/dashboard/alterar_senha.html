{% extends 'base.html' %}
{% block title %}Alterar Senha{% endblock %}
{% block page_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-modern p-4">
            <h5 class="fw-bold mb-3"><i class="fas fa-key me-2 text-warning"></i>Alterar Senha</h5>
            <p class="text-muted">Sua senha é temporária. Por favor, crie uma nova senha.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Nova Senha</label>
                    <input type="password" name="nova_senha" class="form-control bg-light border-0 shadow-sm" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirmar Nova Senha</label>
                    <input type="password" name="confirmar_senha" class="form-control bg-light border-0 shadow-sm" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary-custom w-100">Salvar Nova Senha</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
