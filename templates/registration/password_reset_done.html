{% extends 'registration/auth_base.html' %}

{% block content %}
<div class="text-center mt-4">
    <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex justify-content-center align-items-center mb-3" style="width: 80px; height: 80px;">
        <i class="fas fa-envelope" style="color: #34d399 !important; font-size: 2.5rem !important; text-shadow: 0 0 20px rgba(52, 211, 153, 0.6); display: block;"></i>
    </div>
    <h3 class="fw-bold text-white mb-2">E-mail Enviado</h3>
    <p class="text-white lh-lg mb-4">Enviamos um e-mail com as instruções para redefinir sua senha.<br>Verifique sua caixa de entrada e a pasta de spam.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-light w-100 py-3 rounded-pill">Voltar ao Login</a>
</div>
{% endblock %}
