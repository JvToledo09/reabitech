{% extends 'registration/auth_base.html' %}

{% block content %}
<div class="text-center mb-4">
    <h3 class="fw-bold text-white mb-2">Recuperar Senha</h3>
    <p class="text-white">Digite seu e-mail para receber o link mágico.</p>
</div>

<form method="post" class="mt-4">
    {% csrf_token %}
    <div class="mb-4">
        <label class="form-label text-white fw-bold">E-mail cadastrado</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Enviar Link de Recuperação</button>
    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="text-white text-decoration-none"><i class="fas fa-arrow-left"></i> Voltar ao Login</a>
    </div>
</form>
{% endblock %}
