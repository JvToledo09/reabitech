{% extends 'registration/auth_base.html' %}

{% block content %}
<div class="text-center mt-4">
    <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex justify-content-center align-items-center mb-3" style="width: 80px; height: 80px;">
        <i class="fas fa-check" style="color: #34d399 !important; font-size: 2.5rem !important; text-shadow: 0 0 20px rgba(52, 211, 153, 0.6); display: block;"></i>
    </div>
    <h3 class="fw-bold text-white mb-2">Senha Alterada</h3>
    <p class="text-white lh-lg mb-4">Sua senha foi redefinida com sucesso!<br>Agora você pode fazer login com sua nova senha.</p>
    <a href="{% url 'login' %}" class="btn btn-success w-100 py-3 fw-bold rounded-pill">Fazer Login</a>
</div>
{% endblock %}
