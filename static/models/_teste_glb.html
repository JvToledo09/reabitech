<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Modelo 3D Realista - REABITECH</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; }
    body { background: radial-gradient(ellipse at center, #0d3a2b 0%, #061a14 70%, #030d09 100%); color: #fff; }

    #canvas-wrap { position: fixed; inset: 0; z-index: 1; }

    .hero-info { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; pointer-events: none; }
    .hero-info h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .hero-info p { font-size: 0.78rem; color: rgba(255,255,255,0.5); margin-top: 4px; }

    .painel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 10px 12px; background: rgba(10,42,32,0.75); border: 1px solid rgba(52,211,153,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; max-width: 94vw; }
    .painel button { padding: 7px 12px; border-radius: 9px; border: 1px solid rgba(52,211,153,0.22); background: rgba(52,211,153,0.06); color: rgba(255,255,255,0.8); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.25s cubic-bezier(0.16,1,0.3,1); font-family: inherit; }
    .painel button:hover { background: rgba(52,211,153,0.16); color: #fff; transform: translateY(-1px); }
    .painel button.ativo { background: linear-gradient(135deg, #34d399, #2BA181); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(52,211,153,0.4); }

    .legenda { position: fixed; top: 22px; right: 22px; z-index: 10; padding: 12px 14px; background: rgba(10,42,32,0.7); border: 1px solid rgba(52,211,153,0.18); border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 0.72rem; }
    .legenda-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: rgba(255,255,255,0.72); }
    .legenda-item:last-child { margin-bottom: 0; }
    .legenda-dot { width: 9px; height: 9px; border-radius: 50%; }
    .legenda-dot.normal { background: #5b8a78; }
    .legenda-dot.lesionado { background: #dc2626; box-shadow: 0 0 8px #dc2626; }
    .legenda-dot.destaque { background: #34d399; box-shadow: 0 0 8px #34d399; }

    #status {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 50; padding: 16px 24px; background: rgba(10,42,32,0.95);
        border: 1px solid rgba(52,211,153,0.3); border-radius: 14px;
        color: #34d399; font-family: 'Inter', sans-serif; font-size: 0.9rem;
        text-align: center;
    }
    #status.erro { color: #fca5a5; border-color: rgba(252,165,165,0.5); max-width: 400px; }
    #status.escondido { display: none; }
    #status progress { display: block; width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<div class="hero-info">
    <h1>Modelo Realista Carregado</h1>
    <p>Arraste para girar &middot; scroll para zoom</p>
</div>

<div class="legenda">
    <div class="legenda-item"><span class="legenda-dot normal"></span><span>Normal</span></div>
    <div class="legenda-item"><span class="legenda-dot lesionado"></span><span>Lesionado</span></div>
    <div class="legenda-item"><span class="legenda-dot destaque"></span><span>Hover</span></div>
</div>

<div class="painel" id="painel">
    <button data-mesh="cabeca">Cabeca</button>
    <button data-mesh="neck">Pescoco</button>
    <button data-mesh="torso">Tronco</button>
    <button data-mesh="hip">Quadril</button>
    <button data-mesh="leg">Pernas</button>
    <button data-mesh="arm">Bracos</button>
</div>

<div id="status">Carregando modelo 3D...</div>

<div id="canvas-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
window.addEventListener('error', function(e) {
    var s = document.getElementById('status');
    if (s) { s.classList.add('erro'); s.style.display = 'block'; s.textContent = 'Erro: ' + (e.message || 'desconhecido'); }
});

(function() {
    'use strict';

    var statusEl = document.getElementById('status');

    if (typeof THREE === 'undefined') {
        statusEl.classList.add('erro');
        statusEl.textContent = 'Three.js nao carregou. Verifica conexao.';
        return;
    }

    // ========== CENA ==========
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x061a14, 0.022);

    var camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.55, 5.0);
    camera.lookAt(0, 1.55, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    // ========== CONTROLES ==========
    var controls = null;
    if (typeof THREE.OrbitControls === 'function') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.5;
        controls.maxDistance = 9.0;
        controls.target.set(0, 1.55, 0);
        controls.maxPolarAngle = Math.PI * 0.9;
        controls.minPolarAngle = Math.PI * 0.1;
        controls.enablePan = false;
        controls.autoRotate = false;
    }

    // ========== LUZES ==========
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    var keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);

    var rimLight = new THREE.DirectionalLight(0x34d399, 0.9);
    rimLight.position.set(-5, 4, -4);
    scene.add(rimLight);

    var rimLight2 = new THREE.DirectionalLight(0x2BA181, 0.5);
    rimLight2.position.set(5, 3, -5);
    scene.add(rimLight2);

    var fillLight = new THREE.PointLight(0xffffff, 0.4, 8);
    fillLight.position.set(0, 0.5, 3);
    scene.add(fillLight);

    // ========== CHAO ==========
    var chao = new THREE.Mesh(
        new THREE.CircleGeometry(3.2, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
    );
    chao.rotation.x = -Math.PI / 2;
    chao.position.y = -0.02;
    scene.add(chao);

    var ringBase = new THREE.Mesh(
        new THREE.RingGeometry(1.95, 2.05, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    ringBase.rotation.x = -Math.PI / 2;
    ringBase.position.y = -0.01;
    scene.add(ringBase);

    // ========== ESTADO ==========
    var modelo = null;
    var todos = [];
    var hoverAtual = null;
    var lesaoAtual = { mesh: null, corOriginal: null };

    // Guarda material original de cada mesh
    function salvarMateriais() {
        todos.forEach(function(m) {
            m.userData.matOriginal = m.material.clone();
        });
    }

    function resetarCores() {
        todos.forEach(function(m) {
            if (m === hoverAtual) return;
            m.material = m.userData.matOriginal.clone();
        });
    }

    function destacarMeshPorNome(nome) {
        if (!nome) {
            resetarCores();
            return;
        }
        var achou = false;
        todos.forEach(function(m) {
            var n = (m.name || '').toLowerCase();
            if (n.indexOf(nome.toLowerCase()) !== -1) {
                m.material = new THREE.MeshStandardMaterial({
                    color: 0xff3b3b, emissive: 0xff2222, emissiveIntensity: 0.7,
                    metalness: 0.3, roughness: 0.5
                });
                achou = true;
            }
        });
        if (!achou) {
            console.log('Nenhum mesh com nome contendo:', nome);
        }
    }

    // ========== CARREGA MODELO ==========
    var loader = new THREE.GLTFLoader();
    var MODELO_URL = 'static/models/corpo.glb';

    loader.load(
        MODELO_URL,
        function(gltf) {
            modelo = gltf.scene;

            // Normaliza: escala pra 1.8m de altura, centraliza
            var box = new THREE.Box3().setFromObject(modelo);
            var size = box.getSize(new THREE.Vector3());
            var center = box.getCenter(new THREE.Vector3());

            var alturaDesejada = 1.8;
            var escala = alturaDesejada / size.y;
            modelo.scale.set(escala, escala, escala);

            box.setFromObject(modelo);
            center = box.getCenter(new THREE.Vector3());
            modelo.position.sub(center);
            modelo.position.y += alturaDesejada / 2;

            scene.add(modelo);

            // Coleta todos os meshes
            modelo.traverse(function(child) {
                if (child.isMesh) {
                    todos.push(child);
                    console.log('Mesh:', child.name || '(sem nome)');
                }
            });

            salvarMateriais();

            // Ajusta camera
            if (controls) {
                controls.target.set(0, alturaDesejada / 2, 0);
            }
            camera.position.set(0, alturaDesejada / 2, alturaDesejada * 2.5);

            statusEl.classList.add('escondido');
            statusEl.style.display = 'none';

            console.log('Modelo carregado. Total de meshes:', todos.length);
        },
        function(xhr) {
            if (xhr.total > 0) {
                var pct = Math.round((xhr.loaded / xhr.total) * 100);
                statusEl.textContent = 'Carregando: ' + pct + '%';
            }
        },
        function(erro) {
            statusEl.classList.add('erro');
            statusEl.style.display = 'block';
            statusEl.innerHTML =
                '<strong>Nao foi possivel carregar corpo.glb</strong><br><br>' +
                'Roda esse comando pra baixar:<br><br>' +
                '<code style="background:#000;padding:4px 8px;border-radius:6px;display:inline-block;font-size:0.75rem;">' +
                'cd ~/reabitech && mkdir -p static/models && cd static/models && curl -L -o corpo.glb "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"' +
                '</code>';
        }
    );

    // ========== BOTOES ==========
    var botoes = document.querySelectorAll('#painel button');
    botoes.forEach(function(b) {
        b.addEventListener('click', function() {
            botoes.forEach(function(x) { x.classList.remove('ativo'); });
            b.classList.add('ativo');
            resetarCores();
            destacarMeshPorNome(b.dataset.mesh);
        });
    });

    // ========== RAYCAST (hover) ==========
    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('mousemove', function(e) {
        if (todos.length === 0) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(todos, true);

        if (hits.length > 0) {
            var m = hits[0].object;
            if (hoverAtual !== m) {
                if (hoverAtual) hoverAtual.material = hoverAtual.userData.matOriginal.clone();
                hoverAtual = m;
                m.material = new THREE.MeshStandardMaterial({
                    color: 0x34d399, emissive: 0x34d399, emissiveIntensity: 0.5,
                    metalness: 0.3, roughness: 0.4
                });
            }
        } else {
            if (hoverAtual) {
                hoverAtual.material = hoverAtual.userData.matOriginal.clone();
                hoverAtual = null;
            }
        }
    });

    // ========== ANIMA ==========
    var clock = new THREE.Clock();
    function animar() {
        requestAnimationFrame(animar);
        var t = clock.getElapsedTime();

        if (modelo) {
            modelo.rotation.y += 0.003;
        }

        if (controls) controls.update();
        renderer.render(scene, camera);
    }
    animar();

    window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

})();
</script>
</body>
</html>
