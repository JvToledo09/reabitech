<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Teste Modelo Realista</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    body { background: radial-gradient(ellipse at center, #0f2937 0%, #05161d 70%); color: #fff; }
    #wrap { position: fixed; inset: 0; }
    .info {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        text-align: center; z-index: 10; pointer-events: none;
    }
    .info h1 { font-size: 1.2rem; font-weight: 800; color: #fff; margin: 0 0 4px; }
    .info p { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .painel {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        padding: 10px 12px; background: rgba(10,42,32,0.85);
        border: 1px solid rgba(52,211,153,0.25); border-radius: 12px;
        backdrop-filter: blur(20px); z-index: 10; max-width: 92vw;
    }
    .painel button {
        padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(52,211,153,0.25);
        background: rgba(52,211,153,0.08); color: rgba(255,255,255,0.85);
        font-size: 0.72rem; font-weight: 600; cursor: pointer;
        transition: all 0.2s; font-family: inherit;
    }
    .painel button:hover { background: rgba(52,211,153,0.2); color: #fff; }
    .painel button.ativo {
        background: linear-gradient(135deg, #34d399, #2BA181);
        border-color: transparent; color: #fff;
        box-shadow: 0 4px 14px rgba(52,211,153,0.4);
    }
    #status {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        padding: 16px 24px; background: rgba(10,42,32,0.95);
        border: 1px solid rgba(52,211,153,0.3); border-radius: 14px;
        color: #34d399; font-size: 0.9rem; z-index: 20;
    }
    #status.erro { color: #fca5a5; border-color: rgba(252,165,165,0.5); max-width: 420px; }
</style>
</head>
<body>
<div class="info">
    <h1>Modelo Realista + Marcador</h1>
    <p>Arraste para girar &middot; scroll para zoom</p>
</div>
<div class="painel" id="painel">
    <button data-reg="cabeca">Cabe&ccedil;a</button>
    <button data-reg="ombro_d">Ombro D.</button>
    <button data-reg="ombro_e">Ombro E.</button>
    <button data-reg="cotovelo_d">Cotovelo D.</button>
    <button data-reg="coluna">Coluna</button>
    <button data-reg="lombar">Lombar</button>
    <button data-reg="quadril_d">Quadril D.</button>
    <button data-reg="coxa_d">Coxa D.</button>
    <button data-reg="joelho_d">Joelho D.</button>
    <button data-reg="joelho_e">Joelho E.</button>
    <button data-reg="panturrilha_d">Panturrilha D.</button>
    <button data-reg="pe_d">P&eacute; D.</button>
</div>
<div id="status">Carregando modelo...</div>
<div id="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
    'use strict';
    var status = document.getElementById('status');
    var wrap = document.getElementById('wrap');

    if (typeof THREE === 'undefined') {
        status.classList.add('erro');
        status.textContent = 'Three.js nao carregou';
        return;
    }

    // ---- Cena ----
    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05161d, 0.035);

    var camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 1.0, 4.5);
    camera.lookAt(0, 0.9, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.target.set(0, 0.9, 0);
    controls.enablePan = false;

    // ---- Luzes ----
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    var key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(3, 5, 4); scene.add(key);
    var rim = new THREE.DirectionalLight(0x34d399, 1.0);
    rim.position.set(-4, 3, -3); scene.add(rim);
    var back = new THREE.PointLight(0x2BA181, 0.8, 10);
    back.position.set(0, 3, -3); scene.add(back);
    var fill = new THREE.PointLight(0xffffff, 0.5, 6);
    fill.position.set(0, 1, 3); scene.add(fill);

    // ---- Chão ----
    var chao = new THREE.Mesh(
        new THREE.CircleGeometry(2.5, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.05, side: THREE.DoubleSide })
    );
    chao.rotation.x = -Math.PI/2;
    scene.add(chao);

    var ringBase = new THREE.Mesh(
        new THREE.RingGeometry(1.4, 1.5, 64),
        new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    ringBase.rotation.x = -Math.PI/2;
    ringBase.position.y = 0.01;
    scene.add(ringBase);

    // ---- Marcador (sprite de glow + anel) ----
    var cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    var ctx = cv.getContext('2d');
    var grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,60,60,1)');
    grad.addColorStop(0.3, 'rgba(255,30,30,0.5)');
    grad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    var glowTex = new THREE.CanvasTexture(cv);

    var marker = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.85
    }));
    marker.scale.set(0.35, 0.35, 1);
    scene.add(marker);

    // Anel expansivo
    var ringCv = document.createElement('canvas');
    ringCv.width = 256; ringCv.height = 256;
    var rctx = ringCv.getContext('2d');
    rctx.strokeStyle = 'rgba(255,80,80,1)';
    rctx.lineWidth = 8;
    rctx.beginPath();
    rctx.arc(128, 128, 118, 0, Math.PI*2);
    rctx.stroke();
    var ringTex = new THREE.CanvasTexture(ringCv);
    var ringMark = new THREE.Sprite(new THREE.SpriteMaterial({
        map: ringTex, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.8
    }));
    ringMark.scale.set(0.4, 0.4, 1);
    scene.add(ringMark);

    // ---- Lookup de posições por região ----
    // Valores normalizados pra modelo de 1.8m, pés em y=0
    var POSICOES = {
        cabeca: [0, 1.62, 0],
        cervical: [0, 1.5, 0],
        ombro_d: [-0.22, 1.42, 0],
        ombro_e: [0.22, 1.42, 0],
        braco_d: [-0.42, 1.2, 0],
        braco_e: [0.42, 1.2, 0],
        cotovelo_d: [-0.6, 1.0, 0],
        cotovelo_e: [0.6, 1.0, 0],
        punho_d: [-0.78, 0.85, 0],
        punho_e: [0.78, 0.85, 0],
        coluna: [0, 1.25, 0],
        lombar: [0, 1.05, 0],
        quadril_d: [-0.1, 0.9, 0],
        quadril_e: [0.1, 0.9, 0],
        coxa_d: [-0.1, 0.65, 0],
        coxa_e: [0.1, 0.65, 0],
        joelho_d: [-0.1, 0.5, 0.02],
        joelho_e: [0.1, 0.5, 0.02],
        panturrilha_d: [-0.1, 0.32, -0.02],
        panturrilha_e: [0.1, 0.32, -0.02],
        tornozelo_d: [-0.1, 0.1, 0],
        tornozelo_e: [0.1, 0.1, 0],
        pe_d: [-0.1, 0.03, 0.08],
        pe_e: [0.1, 0.03, 0.08]
    };

    var marcadorAtivo = 'joelho_d';
    var modelo = null;

    // ---- Carrega GLB ----
    var loader = new THREE.GLTFLoader();
    loader.load('static/models/corpo.glb',
        function(gltf) {
            modelo = gltf.scene;

            // Normaliza: 1.8 de altura, pés em y=0
            var box = new THREE.Box3().setFromObject(modelo);
            var size = box.getSize(new THREE.Vector3());
            var escala = 1.8 / size.y;
            modelo.scale.setScalar(escala);

            box.setFromObject(modelo);
            var center = box.getCenter(new THREE.Vector3());
            modelo.position.x -= center.x;
            modelo.position.z -= center.z;
            modelo.position.y -= box.min.y; // pés em y=0

            scene.add(modelo);

            status.style.display = 'none';
            console.log('[Modelo] Carregado. Meshes:');
            modelo.traverse(function(c) {
                if (c.isMesh) console.log(' -', c.name || '(sem nome)');
            });

            // Aplica marcador inicial
            aplicarMarcador(marcadorAtivo);
        },
        function(xhr) {
            if (xhr.total > 0) {
                var pct = Math.round((xhr.loaded/xhr.total)*100);
                status.textContent = 'Carregando: ' + pct + '%';
            }
        },
        function(erro) {
            status.classList.add('erro');
            status.innerHTML = '<strong>Erro ao carregar corpo.glb</strong><br><br>' +
                'Roda:<br><code style="background:#000;padding:4px 8px;border-radius:6px;display:inline-block;font-size:0.7rem;margin-top:6px;">cd ~/reabitech/static/models && curl -L -o corpo.glb "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb"</code>';
            console.error(erro);
        }
    );

    // ---- Aplica marcador ----
    function aplicarMarcador(regiao) {
        marcadorAtivo = regiao;
        var pos = POSICOES[regiao];
        if (!pos) {
            marker.visible = false;
            ringMark.visible = false;
            return;
        }
        marker.visible = true;
        ringMark.visible = true;
        marker.position.set(pos[0], pos[1], pos[2]);
        ringMark.position.set(pos[0], pos[1], pos[2] + 0.05);
    }

    // ---- Botões ----
    var botoes = document.querySelectorAll('#painel button');
    botoes.forEach(function(b) {
        b.addEventListener('click', function() {
            botoes.forEach(function(x) { x.classList.remove('ativo'); });
            b.classList.add('ativo');
            aplicarMarcador(b.dataset.reg);
        });
    });
    // Ativa o primeiro (joelho direito)
    var btnInicial = document.querySelector('#painel button[data-reg="joelho_d"]');
    if (btnInicial) {
        btnInicial.classList.add('ativo');
        aplicarMarcador('joelho_d');
    }

    // ---- Animação ----
    var clock = new THREE.Clock();
    function animar() {
        requestAnimationFrame(animar);
        var t = clock.getElapsedTime();

        if (modelo) modelo.rotation.y += 0.003;

        // Marker pulse
        var p = 1 + Math.sin(t * 3) * 0.15;
        marker.scale.set(0.35 * p, 0.35 * p, 1);
        marker.material.opacity = 0.55 + Math.sin(t * 3) * 0.3;

        // Ring expande
        var cycle = (t * 0.7) % 1.8;
        var prog = cycle / 1.8;
        var s = 0.3 + prog * 0.9;
        ringMark.scale.set(s, s, 1);
        ringMark.material.opacity = Math.max(0, 1 - prog) * 0.75;

        ringBase.material.opacity = 0.2 + Math.sin(t * 1.2) * 0.08;

        controls.update();
        renderer.render(scene, camera);
    }
    animar();

    addEventListener('resize', function() {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
})();
</script>
</body>
</html>
