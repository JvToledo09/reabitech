<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login ReabiTech</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#031b2e,#014f4f,#00283b);
color:white;
}
.box{
width:420px;
padding:40px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(14px);
box-shadow:0 20px 40px rgba(0,0,0,.3);
}
h1{
text-align:center;
margin-bottom:30px;
}
input{
width:100%;
padding:16px;
margin-bottom:18px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.08);
color:white;
font-size:16px;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:40px;
font-size:16px;
font-weight:700;
cursor:pointer;
background:linear-gradient(90deg,#39ffd3,#00b37a);
}
button:hover{
transform:scale(1.02);
}
</style>
</head>
<body>

<div class="box">
<h1>ReabiTech</h1>

<input type="text" placeholder="Usuário">
<input type="password" placeholder="Senha">

<a href="/dashboard">
    <button>Entrar</button>
    </a>
</div>

</body>
</html>
