<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReabiTech</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#031b2e,#062b3d,#014d4e);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:#3fffd7;
filter:blur(180px);
top:-100px;
left:-100px;
opacity:.18;
animation:float 8s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#00ff95;
filter:blur(180px);
bottom:-120px;
right:-120px;
opacity:.15;
animation:float 10s infinite alternate;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(50px);}
}

.container{
position:relative;
z-index:2;
width:90%;
max-width:1100px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.left h1{
font-size:64px;
line-height:1.1;
margin-bottom:20px;
}

.left h1 span{
color:#47ffd8;
}

.left p{
font-size:20px;
color:#c7e7e7;
margin-bottom:35px;
line-height:1.6;
}

.btn{
display:inline-block;
padding:16px 34px;
background:linear-gradient(90deg,#2fffd1,#00b87a);
color:#002e2e;
font-weight:700;
border-radius:40px;
text-decoration:none;
box-shadow:0 0 25px rgba(0,255,180,.35);
transition:.3s;
}

.btn:hover{
transform:translateY(-4px) scale(1.03);
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
padding:35px;
border-radius:28px;
backdrop-filter:blur(16px);
box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:20px;
}

.mini{
padding:20px;
border-radius:18px;
background:rgba(0,255,180,.08);
}

.mini h3{
font-size:28px;
color:#47ffd8;
}

.mini p{
font-size:14px;
color:#d6ffff;
margin-top:6px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
text-align:center;
}

.left h1{
font-size:48px;
}
}
</style>
</head>
<body>

<div class="container">

<div class="left">
<h1>Reabi<span>Tech</span></h1>
<p>
Plataforma inteligente para acompanhamento de atletas,
reabilitação física, desempenho esportivo e suporte multidisciplinar.
</p>

<a href="/login" class="btn">Entrar no Sistema</a>
</div>

<div class="card">
<h2>Painel Estratégico</h2>

<div class="info">

<div class="mini">
<h3>128</h3>
<p>Atletas Monitorados</p>
</div>

<div class="mini">
<h3>94%</h3>
<p>Taxa de Recuperação</p>
</div>

<div class="mini">
<h3>36</h3>
<p>Planos Ativos</p>
</div>

<div class="mini">
<h3>24h</h3>
<p>Atualização em Tempo Real</p>
</div>

</div>
</div>

</div>

</body>
</html>
